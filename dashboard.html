<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>onionwatch — доступность onion-сервисов</title>
<style>
  :root {
    --ink: #0f1220;
    --panel: #161a2c;
    --panel-2: #1c2138;
    --line: #272d4a;
    --text: #e7e9f5;
    --muted: #949bc4;
    --dim: #5d6390;
    --up: #3ecfa0;
    --down: #ff5d73;
    --slow: #f2b64c;
    --circuit: #8f7bff;
    --mono: ui-monospace, "JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--ink); color: var(--text); font-family: var(--sans);
    font-size: 15px; line-height: 1.5;
    background-image: radial-gradient(circle at 15% -10%, #1d2244 0%, transparent 55%);
    background-attachment: fixed;
  }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 28px 20px 64px; }

  .eyebrow {
    font-family: var(--mono); font-size: 11px; letter-spacing: .18em;
    text-transform: uppercase; color: var(--dim);
  }

  header.top { display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-end;
    justify-content: space-between; border-bottom: 1px solid var(--line); padding-bottom: 18px; }
  h1 { font-size: 26px; margin: 4px 0 0; font-weight: 620; letter-spacing: -.01em; }
  h1 span { color: var(--circuit); }
  .meta { display: flex; gap: 22px; flex-wrap: wrap; align-items: center;
    font-family: var(--mono); font-size: 12px; color: var(--muted); }
  .meta b { color: var(--text); font-weight: 600; }
  .dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block;
    margin-right: 7px; vertical-align: 1px; background: var(--dim); }
  .dot.on { background: var(--up); box-shadow: 0 0 0 3px rgba(62,207,160,.16); }
  .dot.off { background: var(--down); box-shadow: 0 0 0 3px rgba(255,93,115,.16); }

  .controls { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin: 20px 0 14px; }
  input[type=search], .btn {
    font: inherit; font-size: 13px; color: var(--text); background: var(--panel);
    border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px;
  }
  input[type=search] { min-width: 220px; flex: 1 1 220px; font-family: var(--mono); }
  input[type=search]::placeholder { color: var(--dim); }
  .btn { cursor: pointer; }
  .btn:hover { background: var(--panel-2); border-color: #3a4270; }
  .btn[aria-pressed="true"] { border-color: var(--circuit); color: #fff;
    background: linear-gradient(var(--panel-2), var(--panel)); }
  :focus-visible { outline: 2px solid var(--circuit); outline-offset: 2px; }

  .row {
    display: grid; gap: 4px 18px; align-items: center;
    grid-template-columns: minmax(220px, 1.4fr) 88px 88px 1fr 92px;
    grid-template-areas: "id day week tape act";
    background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--dim);
    border-radius: 10px; padding: 14px 16px; margin-bottom: 8px;
  }
  .row.up { border-left-color: var(--up); }
  .row.down { border-left-color: var(--down); }
  .row.pending { border-left-color: var(--dim); }

  .id { grid-area: id; min-width: 0; }
  .name { font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .name .pill {
    font-family: var(--mono); font-size: 10px; letter-spacing: .08em; text-transform: uppercase;
    padding: 2px 6px; border-radius: 4px; border: 1px solid currentColor; opacity: .9;
  }
  .up .pill { color: var(--up); }
  .down .pill { color: var(--down); }
  .pending .pill { color: var(--dim); }
  .addr { font-family: var(--mono); font-size: 12px; color: var(--muted);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .err { font-size: 12.5px; color: var(--down); margin-top: 4px; }
  .note { font-size: 12.5px; color: var(--dim); margin-top: 2px; }

  .stat { text-align: right; font-family: var(--mono); }
  .stat .v { font-size: 17px; font-variant-numeric: tabular-nums; }
  .stat .k { font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--dim); }
  .stat.day { grid-area: day; } .stat.week { grid-area: week; }
  .v.good { color: var(--up); } .v.warn { color: var(--slow); } .v.bad { color: var(--down); }
  .v.none { color: var(--dim); }

  /* Подпись: лента проверок. Нижняя часть штриха — построение цепочки Tor,
     верхняя — ответ самого сервиса. */
  .signal { grid-area: tape; min-width: 0; }
  .tape { display: flex; align-items: flex-end; gap: 2px; height: 44px;
    padding: 0 2px; border-bottom: 1px solid var(--line); }
  .tick { flex: 1 1 0; min-width: 2px; display: flex; flex-direction: column;
    justify-content: flex-end; height: 100%; }
  .tick i { display: block; border-radius: 1px; }
  .tick .svc { background: var(--up); }
  .tick .cir { background: var(--circuit); opacity: .75; }
  .tick.bad i { background: var(--down); }
  .tick.empty i { background: var(--line); }
  .legend { font-family: var(--mono); font-size: 10px; color: var(--dim);
    letter-spacing: .1em; text-transform: uppercase; margin-top: 6px;
    display: flex; justify-content: space-between; }
  .legend b { font-weight: 400; color: var(--muted); }
  .legend .sw { display: inline-block; width: 7px; height: 7px; border-radius: 2px;
    margin-right: 4px; vertical-align: 0; }

  .act { grid-area: act; text-align: right; }
  .act .btn { padding: 6px 10px; font-size: 12px; }

  .empty { border: 1px dashed var(--line); border-radius: 10px; padding: 40px 24px;
    text-align: center; color: var(--muted); }
  .banner { border: 1px solid var(--down); background: rgba(255,93,115,.08);
    border-radius: 10px; padding: 12px 16px; margin-bottom: 16px; font-size: 14px; }
  footer { margin-top: 26px; font-size: 12px; color: var(--dim); font-family: var(--mono); }

  @media (max-width: 820px) {
    .row { grid-template-columns: 1fr 88px 88px;
      grid-template-areas: "id day week" "tape tape tape" "act act act"; }
    .tape { margin-top: 10px; }
    .act { text-align: left; }
  }
  @media (prefers-reduced-motion: no-preference) {
    .row { transition: border-color .25s ease; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <div>
      <div class="eyebrow">Мониторинг скрытых сервисов</div>
      <h1>onion<span>watch</span></h1>
    </div>
    <div class="meta" id="meta"></div>
  </header>

  <div class="controls">
    <input type="search" id="filter" placeholder="фильтр по имени или адресу" aria-label="Фильтр">
    <button class="btn" id="only-down" aria-pressed="false">Только недоступные</button>
    <button class="btn" id="refresh">Обновить</button>
    <button class="btn" id="auto" aria-pressed="true">Автообновление: вкл</button>
  </div>

  <div id="banner"></div>
  <div id="list"></div>

  <footer id="foot"></footer>
</div>

<script>
const REFRESH_MS = 15000;
let state = null, auto = true, onlyDown = false, timer = null;

const el = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ms = v => v == null ? "—" : (v >= 10000 ? (v/1000).toFixed(1) + " с" : Math.round(v) + " мс");
const pct = v => v == null ? "—" : (v >= 99.95 ? "100" : v.toFixed(v >= 10 ? 1 : 2)) + "%";
const ago = ts => {
  if (!ts) return "никогда";
  const d = Math.max(0, Date.now()/1000 - ts);
  if (d < 60) return Math.round(d) + " с назад";
  if (d < 3600) return Math.round(d/60) + " мин назад";
  if (d < 86400) return Math.round(d/3600) + " ч назад";
  return Math.round(d/86400) + " д назад";
};
const clock = ts => new Date(ts*1000).toLocaleTimeString("ru-RU");
const grade = v => v == null ? "none" : v >= 99 ? "good" : v >= 95 ? "warn" : "bad";

function tape(history) {
  const slots = 60;
  const pad = Array(Math.max(0, slots - history.length)).fill(null);
  const items = pad.concat(history.slice(-slots));
  const worst = Math.max(1000, ...history.filter(h => h.ok).map(h => h.ttfb_ms || h.connect_ms || 0));
  return items.map(h => {
    if (!h) return '<span class="tick empty" aria-hidden="true"><i style="height:2px"></i></span>';
    const when = clock(h.ts);
    if (!h.ok) {
      const why = h.error || h.error_slug || "недоступен";
      return `<span class="tick bad" title="${esc(when)} — ${esc(why)}"><i style="height:100%"></i></span>`;
    }
    const circuit = h.connect_ms || 0;
    const svc = Math.max(0, (h.ttfb_ms || circuit) - circuit);
    const scale = v => Math.max(2, Math.min(100, Math.round(100 * v / worst)));
    const hc = scale(circuit), hs = Math.min(100 - hc, scale(svc));
    const tip = `${when} — HTTP ${h.status ?? "ok"} · цепочка ${ms(circuit)} · ответ ${ms(svc)}`;
    return `<span class="tick" title="${esc(tip)}">`
         + `<i class="svc" style="height:${hs}%"></i><i class="cir" style="height:${hc}%"></i></span>`;
  }).join("");
}

function row(t) {
  const last = t.last;
  const status = !last ? "pending" : (last.ok ? "up" : "down");
  const word = status === "up" ? "доступен" : status === "down" ? "недоступен" : "не проверялся";
  const detail = last && !last.ok
    ? `<div class="err">${esc(last.error || "недоступен")}</div>` : "";
  const note = t.note ? `<div class="note">${esc(t.note)}</div>` : "";
  const d = t.day, w = t.week;
  return `<article class="row ${status}" data-name="${esc(t.name)}">
    <div class="id">
      <div class="name">${esc(t.name)} <span class="pill">${word}</span></div>
      <div class="addr" title="${esc(t.url)}">${esc(t.host)}${t.port !== 80 ? ":" + t.port : ""}</div>
      ${detail}${note}
    </div>
    <div class="stat day">
      <div class="v ${grade(d.uptime)}">${pct(d.uptime)}</div>
      <div class="k">24 часа</div>
    </div>
    <div class="stat week">
      <div class="v ${grade(w.uptime)}">${pct(w.uptime)}</div>
      <div class="k">7 дней</div>
    </div>
    <div class="signal">
      <div class="tape">${tape(t.history)}</div>
      <div class="legend">
        <span><span class="sw" style="background:var(--circuit)"></span>цепочка <b>${ms(d.avg_circuit_ms)}</b>
              &nbsp; <span class="sw" style="background:var(--up)"></span>ответ <b>${ms(d.avg_ttfb_ms)}</b></span>
        <span>${last ? esc(ago(last.ts)) : "—"} · раз в ${Math.round(t.interval/60)} мин</span>
      </div>
    </div>
    <div class="act">
      <button class="btn recheck" data-name="${esc(t.name)}" ${t.checking ? "disabled" : ""}>
        ${t.checking ? "проверяю…" : "Проверить"}
      </button>
    </div>
  </article>`;
}

function render() {
  if (!state) return;
  const q = el("filter").value.trim().toLowerCase();
  let list = state.targets;
  if (q) list = list.filter(t => (t.name + " " + t.host).toLowerCase().includes(q));
  if (onlyDown) list = list.filter(t => t.last && !t.last.ok);

  el("meta").innerHTML =
    `<span><span class="dot ${state.tor_ok ? "on" : "off"}"></span>tor ${esc(state.tor_socks)}</span>`
    + `<span>доступно <b>${state.up}/${state.total}</b></span>`
    + `<span>обновлено ${clock(state.generated_at)}</span>`;

  el("banner").innerHTML = state.tor_ok ? "" :
    `<div class="banner">SOCKS-порт Tor не отвечает по адресу ${esc(state.tor_socks)}.
     Проверки будут падать, пока демон tor не запущен.</div>`;

  el("list").innerHTML = list.length ? list.map(row).join("")
    : `<div class="empty">Ничего не совпало с фильтром.</div>`;

  el("foot").textContent =
    `цели проверяются через SOCKS5 локального Tor · история хранится в SQLite · `
    + `следующее автообновление через ${REFRESH_MS/1000} с`;
}

async function load() {
  try {
    const r = await fetch("/api/state", { cache: "no-store" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    state = await r.json();
    render();
  } catch (e) {
    el("banner").innerHTML =
      `<div class="banner">Дашборд не получил данные от onionwatch: ${esc(e.message)}.
       Проверьте, что процесс запущен.</div>`;
  }
}

function schedule() {
  clearInterval(timer);
  if (auto) timer = setInterval(load, REFRESH_MS);
}

el("list").addEventListener("click", async ev => {
  const btn = ev.target.closest(".recheck");
  if (!btn) return;
  btn.disabled = true; btn.textContent = "проверяю…";
  await fetch(`/api/targets/${encodeURIComponent(btn.dataset.name)}/check`, { method: "POST" });
  setTimeout(load, 1500);
});
el("filter").addEventListener("input", render);
el("refresh").addEventListener("click", load);
el("only-down").addEventListener("click", ev => {
  onlyDown = !onlyDown;
  ev.currentTarget.setAttribute("aria-pressed", String(onlyDown));
  render();
});
el("auto").addEventListener("click", ev => {
  auto = !auto;
  ev.currentTarget.setAttribute("aria-pressed", String(auto));
  ev.currentTarget.textContent = "Автообновление: " + (auto ? "вкл" : "выкл");
  schedule();
});

load(); schedule();
</script>
</body>
</html>
