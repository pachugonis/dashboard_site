<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>onionwatch — доступность onion-сервисов</title>
<style>
  :root {
    --ink: #0f1220;
    --panel: #161a2c;
    --panel-2: #1c2138;
    --line: #272d4a;
    --text: #e7e9f5;
    --muted: #949bc4;
    --dim: #5d6390;
    /* Статусные цвета: только состояние, всегда рядом со словом. */
    --up: #3ecfa0;
    --down: #ff5d73;
    --slow: #f2b64c;    /* не состояние: им подсвечивается просевший аптайм */
    /* Цвета данных в ленте: проверены validate_palette.js на панели #161a2c
       (полоса светлоты, CVD-разделение, контраст). Не путать со статусными. */
    --circuit: #8f7bff;
    --svc: #31a883;
    --mono: ui-monospace, "JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--ink); color: var(--text); font-family: var(--sans);
    font-size: 15px; line-height: 1.5;
    background-image: radial-gradient(circle at 15% -10%, #1d2244 0%, transparent 55%);
    background-attachment: fixed;
  }
  .wrap { max-width: 1320px; margin: 0 auto; padding: 28px 20px 64px; }

  .eyebrow {
    font-family: var(--mono); font-size: 11px; letter-spacing: .18em;
    text-transform: uppercase; color: var(--dim);
  }

  header.top { display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-end;
    justify-content: space-between; border-bottom: 1px solid var(--line); padding-bottom: 18px; }
  h1 { font-size: 26px; margin: 4px 0 0; font-weight: 620; letter-spacing: -.01em; }
  h1 span { color: var(--circuit); }
  .meta { display: flex; gap: 22px; flex-wrap: wrap; align-items: center;
    font-family: var(--mono); font-size: 12px; color: var(--muted); }
  .meta b { color: var(--text); font-weight: 600; }
  .meta a { color: var(--muted); }
  .dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block;
    margin-right: 7px; vertical-align: 1px; background: var(--dim); }
  .dot.on { background: var(--up); box-shadow: 0 0 0 3px rgba(62,207,160,.16); }
  .dot.off { background: var(--down); box-shadow: 0 0 0 3px rgba(255,93,115,.16); }

  /* Сводка: три числа, которыми дашборд открывается. */
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 10px; margin: 22px 0 6px; }
  .kpi { background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    padding: 14px 16px; }
  .kpi .v { font-size: 40px; line-height: 1.05; font-weight: 600;
    font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
  .kpi .k { font-family: var(--mono); font-size: 10px; letter-spacing: .14em;
    text-transform: uppercase; color: var(--dim); margin-top: 4px; }
  .kpi.ok .v { color: var(--up); } .kpi.bad .v { color: var(--down); }
  .kpi.wait .v { color: var(--muted); }

  .controls { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin: 18px 0 16px; }
  input[type=search], .btn {
    font: inherit; font-size: 13px; color: var(--text); background: var(--panel);
    border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px;
  }
  input[type=search] { min-width: 220px; flex: 1 1 220px; font-family: var(--mono); }
  input[type=search]::placeholder { color: var(--dim); }
  .btn { cursor: pointer; text-decoration: none; display: inline-block; }
  .btn:hover { background: var(--panel-2); border-color: #3a4270; }
  .btn[aria-pressed="true"] { border-color: var(--circuit); color: #fff;
    background: linear-gradient(var(--panel-2), var(--panel)); }
  :focus-visible { outline: 2px solid var(--circuit); outline-offset: 2px; }

  /* Окна: по одному на сервис. */
  .grid { display: grid; gap: 14px;
    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); }
  .card { background: var(--panel); border: 1px solid var(--line);
    border-top: 3px solid var(--dim); border-radius: 12px; padding: 16px 18px 14px;
    display: flex; flex-direction: column; gap: 12px; min-width: 0; }
  .card.up { border-top-color: var(--up); }
  .card.down { border-top-color: var(--down); }
  .card.pending { border-top-color: var(--dim); }

  .head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
  .ident { display: flex; gap: 11px; align-items: center; min-width: 0; }
  /* Картинка не обязана быть квадратной: SVG сохраняется как есть, а растр —
     когда браузер не дал админке прочитать canvas. Поэтому contain, а не cover:
     широкую картинку надо показать целиком, а не срезать. */
  .avatar { width: 44px; height: 44px; flex: none; border-radius: 10px;
    object-fit: contain; border: 1px solid var(--line); background: var(--panel-2); }
  .name { font-weight: 600; font-size: 16px; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .kinds { font-family: var(--mono); font-size: 11.5px; color: var(--dim); }
  /* Статус — цвет плюс слово: по одному цвету состояние читать нельзя. */
  .pill { font-family: var(--mono); font-size: 10px; letter-spacing: .08em;
    text-transform: uppercase; padding: 3px 7px; border-radius: 5px;
    border: 1px solid currentColor; white-space: nowrap; flex: none; }
  .up .pill { color: var(--up); } .down .pill { color: var(--down); }
  .pending .pill { color: var(--dim); }

  /* Адреса цели: обычный и onion-зеркала. Каждый — ссылка в новое окно
     и собственное состояние; никаких причин, только доступен или нет. */
  .addrs { display: flex; flex-direction: column; gap: 6px; }
  .addr { display: flex; align-items: center; gap: 8px; min-width: 0;
    text-decoration: none; color: var(--text); background: var(--panel-2);
    border: 1px solid var(--line); border-radius: 8px; padding: 6px 9px;
    font-family: var(--mono); font-size: 11.5px; }
  .addr:hover { border-color: #3a4270; }
  .addr .kind { flex: none; font-size: 9px; letter-spacing: .1em;
    text-transform: uppercase; color: var(--dim); border: 1px solid var(--line);
    border-radius: 4px; padding: 1px 5px; }
  /* Хэш onion не переносится ни по чему: режем по ширине, целиком — в подсказке. */
  .addr .host { flex: 1 1 auto; min-width: 0; color: var(--muted);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .addr .mark { flex: none; font-size: 9px; letter-spacing: .1em;
    text-transform: uppercase; }
  .addr.up .mark { color: var(--up); }
  .addr.down .mark { color: var(--down); }
  .addr.pending .mark { color: var(--dim); }
  .addr .go { flex: none; color: var(--dim); }
  .addr:hover .go { color: var(--circuit); }

  .figures { display: flex; align-items: baseline; gap: 18px; }
  .fig .v { font-size: 30px; font-weight: 600; font-variant-numeric: tabular-nums;
    letter-spacing: -.02em; line-height: 1.1; }
  .fig.small .v { font-size: 17px; color: var(--muted); }
  .fig .k { font-family: var(--mono); font-size: 10px; letter-spacing: .12em;
    text-transform: uppercase; color: var(--dim); }
  .v.good { color: var(--up); } .v.warn { color: var(--slow); } .v.bad { color: var(--down); }
  .v.none { color: var(--dim); }

  /* Лента проверок. Нижняя часть штриха — построение цепочки Tor,
     верхняя — ответ самого сервиса. Порядок частей всегда один и тот же. */
  .tape { display: flex; align-items: flex-end; gap: 2px; height: 40px;
    padding: 0 2px; border-bottom: 1px solid var(--line); }
  .tick { flex: 1 1 0; min-width: 2px; display: flex; flex-direction: column;
    justify-content: flex-end; height: 100%; }
  .tick i { display: block; border-radius: 2px 2px 0 0; }
  .tick .svc { background: var(--svc); margin-bottom: 2px; border-radius: 2px; }
  .tick .cir { background: var(--circuit); }
  .tick.bad i { background: var(--down); border-radius: 2px 2px 0 0; }
  .tick.empty i { background: var(--line); }
  .legend { font-family: var(--mono); font-size: 10px; color: var(--dim);
    letter-spacing: .06em; text-transform: uppercase; margin-top: 7px;
    display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .legend b { font-weight: 400; color: var(--muted); }
  .legend .sw { display: inline-block; width: 7px; height: 7px; border-radius: 2px;
    margin-right: 4px; vertical-align: 0; }

  .note { font-size: 12.5px; color: var(--dim); }
  .foot-row { display: flex; align-items: center; justify-content: space-between;
    gap: 10px; margin-top: auto; padding-top: 4px; }
  .when { font-family: var(--mono); font-size: 11px; color: var(--dim); }
  .foot-row .btn { padding: 6px 10px; font-size: 12px; }

  /* Именно .empty-state, а не .empty: короткое имя пересекается с .tick.empty
     в ленте и разносит пустые штрихи в дашед-боксы. */
  .empty-state { border: 1px dashed var(--line); border-radius: 12px; padding: 44px 24px;
    text-align: center; color: var(--muted); grid-column: 1 / -1; }
  .empty-state a { color: var(--circuit); }
  .banner { border: 1px solid var(--down); background: rgba(255,93,115,.08);
    border-radius: 10px; padding: 12px 16px; margin-bottom: 16px; font-size: 14px; }
  footer { margin-top: 26px; font-size: 12px; color: var(--dim); font-family: var(--mono); }

  @media (prefers-reduced-motion: no-preference) {
    .card { transition: border-color .25s ease; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <div>
      <div class="eyebrow">Мониторинг скрытых сервисов</div>
      <h1>onion<span>watch</span></h1>
    </div>
    <div class="meta" id="meta"></div>
  </header>

  <section class="kpis" id="kpis" aria-label="Сводка"></section>

  <div class="controls">
    <input type="search" id="filter" placeholder="фильтр по имени или адресу" aria-label="Фильтр">
    <button class="btn" id="only-bad" aria-pressed="false">Только проблемные</button>
    <button class="btn" id="refresh">Обновить</button>
    <button class="btn" id="auto" aria-pressed="true">Автообновление: вкл</button>
    <a class="btn" href="/admin">Админка</a>
  </div>

  <div id="banner"></div>
  <div class="grid" id="list"></div>

  <footer id="foot"></footer>
</div>

<script>
const REFRESH_MS = 15000;
let state = null, auto = true, onlyBad = false, timer = null;

const el = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ms = v => v == null ? "—" : (v >= 10000 ? (v/1000).toFixed(1) + " с" : Math.round(v) + " мс");
const pct = v => v == null ? "—" : (v >= 99.95 ? "100" : v.toFixed(v >= 10 ? 1 : 2)) + "%";
const ago = ts => {
  if (!ts) return "ещё не проверялся";
  const d = Math.max(0, Date.now()/1000 - ts);
  if (d < 60) return Math.round(d) + " с назад";
  if (d < 3600) return Math.round(d/60) + " мин назад";
  if (d < 86400) return Math.round(d/3600) + " ч назад";
  return Math.round(d/86400) + " д назад";
};
const clock = ts => new Date(ts*1000).toLocaleTimeString("ru-RU");
const grade = v => v == null ? "none" : v >= 99 ? "good" : v >= 95 ? "warn" : "bad";
// Состояния два: до сервиса достучались или нет. У записей, сделанных до
// появления поля state, его нет, а до перехода на два состояния там могло
// стоять 'warn' — «ответил не тем», что теперь считается доступностью.
const stateOf = h => !h ? "pending"
  : (h.state ? h.state === "down" : !h.ok) ? "down" : "up";
const WORD = { up: "доступен", down: "недоступен", pending: "в очереди" };

function tape(history) {
  const slots = 60;
  const pad = Array(Math.max(0, slots - history.length)).fill(null);
  const items = pad.concat(history.slice(-slots));
  const alive = history.filter(h => stateOf(h) !== "down");
  const worst = Math.max(1000, ...alive.map(h => h.ttfb_ms || h.connect_ms || 0));
  return items.map(h => {
    if (!h) return '<span class="tick empty" aria-hidden="true"><i style="height:2px"></i></span>';
    const when = clock(h.ts);
    // Сколько попыток стоило за этой отметкой: одна — обычное дело и молчим,
    // несколько — видно, что цель на грани, даже когда полоска зелёная.
    const tries = (h.attempts || 1) > 1 ? ` · попыток: ${h.attempts}` : "";
    const st = stateOf(h);
    if (st === "down") {
      return `<span class="tick bad" title="${esc(when + " — недоступен" + tries)}"><i style="height:100%"></i></span>`;
    }
    const circuit = h.connect_ms || 0;
    const scale = v => Math.max(2, Math.min(100, Math.round(100 * v / worst)));
    const hc = scale(circuit);
    // В режиме tcp ответа нет вообще (ttfb_ms пуст) — рисуем только цепочку,
    // иначе зелёная полоска обозначала бы несуществующее время ответа.
    const svc = h.ttfb_ms == null ? null : Math.max(0, h.ttfb_ms - circuit);
    const hs = svc ? Math.min(100 - hc, scale(svc)) : 0;
    const timings = svc == null ? `цепочка ${ms(circuit)}`
      : `цепочка ${ms(circuit)} · ответ ${ms(svc)}`;
    const tip = `${when} — доступен · ${timings}${tries}`;
    return `<span class="tick ${st}" title="${esc(tip)}">`
         + (hs ? `<i class="svc" style="height:${hs}%"></i>` : "")
         + `<i class="cir" style="height:${hc}%"></i></span>`;
  }).join("");
}

// Строка адреса: вид, сам адрес, состояние и переход по ссылке. Открывается
// в новом окне — noopener и no-referrer, чтобы страница по ту сторону не
// узнала, откуда пришли, и не дотянулась до дашборда.
function addrRow(a) {
  const st = stateOf(a.last);
  return `<a class="addr ${st}" href="${esc(a.url)}" target="_blank"
     rel="noopener noreferrer" title="${esc(a.url)}"
     aria-label="${esc(a.url)} — ${WORD[st]}, откроется в новом окне">
    <span class="kind">${a.kind === "clear" ? "clear" : "onion"}</span>
    <span class="host">${esc(a.label)}</span>
    <span class="mark">${WORD[st]}</span>
    <span class="go" aria-hidden="true">↗</span>
  </a>`;
}

function card(t) {
  const addrs = t.addresses || [];
  // Цель доступна, пока отвечает хоть один адрес: зеркала на то и заводят.
  const status = stateOf(t.last);
  const d = t.day, w = t.week;
  const note = t.note ? `<div class="note">${esc(t.note)}</div>` : "";
  const onions = addrs.filter(a => a.kind === "onion").length;
  const kinds = [addrs.length > onions ? "1 обычный" : "",
                 onions ? `${onions} onion` : ""].filter(Boolean).join(" · ");
  return `<article class="card ${status}" data-name="${esc(t.name)}">
    <div class="head">
      <div class="ident">
        ${t.has_image
          ? `<img class="avatar" src="/api/targets/${t.id}/image?v=${t.image_v}" alt="">`
          : ""}
        <div style="min-width:0">
          <div class="name" title="${esc(t.name)}">${esc(t.name)}</div>
          <div class="kinds">${esc(kinds)}</div>
        </div>
      </div>
      <span class="pill">${WORD[status]}</span>
    </div>

    <div class="figures">
      <div class="fig">
        <div class="v ${grade(d.uptime)}">${pct(d.uptime)}</div>
        <div class="k">аптайм 24 ч</div>
      </div>
      <div class="fig small">
        <div class="v ${grade(w.uptime)}">${pct(w.uptime)}</div>
        <div class="k">7 дней</div>
      </div>
    </div>

    <div class="addrs">${addrs.map(addrRow).join("")}</div>

    ${note}

    <div>
      <div class="tape">${tape(t.history)}</div>
      <div class="legend">
        <span><span class="sw" style="background:var(--circuit)"></span>цепочка <b>${ms(d.avg_circuit_ms)}</b></span>
        <span><span class="sw" style="background:var(--svc)"></span>ответ <b>${ms(d.avg_ttfb_ms)}</b></span>
        <span>${d.checks} проверок</span>
      </div>
    </div>

    <div class="foot-row">
      <span class="when">${t.last ? esc(ago(t.last.ts)) : "ещё не проверялся"} · раз в ${Math.round(t.interval/60)} мин</span>
      <button class="btn recheck" data-name="${esc(t.name)}" ${t.checking ? "disabled" : ""}>
        ${t.checking ? "проверяю…" : "Проверить"}
      </button>
    </div>
  </article>`;
}

function render() {
  if (!state) return;
  const q = el("filter").value.trim().toLowerCase();
  let list = state.targets;
  // Фильтр ищет по всем адресам цели, а не только по главному: зеркало помнят
  // не хуже основного адреса.
  if (q) list = list.filter(t => (t.name + " " + (t.addresses || [])
    .map(a => a.url).join(" ")).toLowerCase().includes(q));
  // Проблемной считаем и цель, у которой упало одно зеркало из нескольких:
  // сервис ещё жив, но повод посмотреть уже есть.
  if (onlyBad) list = list.filter(t => t.last && (t.addresses || [])
    .some(a => stateOf(a.last) === "down"));

  el("meta").innerHTML =
    `<span><span class="dot ${state.tor_ok ? "on" : "off"}"></span>tor ${esc(state.tor_socks)}</span>`
    + `<span>обновлено ${clock(state.generated_at)}</span>`;

  el("kpis").innerHTML = state.total ? [
    `<div class="kpi ok"><div class="v">${state.up}</div><div class="k">доступно</div></div>`,
    `<div class="kpi bad"><div class="v">${state.down}</div><div class="k">недоступно</div></div>`,
    `<div class="kpi wait"><div class="v">${state.pending}</div><div class="k">ещё не проверялись</div></div>`,
  ].join("") : "";

  el("banner").innerHTML = state.tor_ok ? "" :
    `<div class="banner">SOCKS-порт Tor не отвечает по адресу ${esc(state.tor_socks)}.
     Проверки будут падать, пока демон tor не запущен.</div>`;

  el("list").innerHTML = list.length ? list.map(card).join("")
    : (state.total
        ? `<div class="empty-state">Ничего не совпало с фильтром.</div>`
        : `<div class="empty-state">Ни одной цели пока нет.<br>
           Добавьте onion-адреса в <a href="/admin">админке</a>.</div>`);

  el("foot").textContent =
    `цели проверяются через SOCKS5 локального Tor · история хранится в SQLite · `
    + `автообновление каждые ${REFRESH_MS/1000} с`;
}

async function load() {
  try {
    const r = await fetch("/api/state", { cache: "no-store" });
    if (r.status === 401) { location.href = "/admin"; return; }
    if (!r.ok) throw new Error("HTTP " + r.status);
    state = await r.json();
    render();
  } catch (e) {
    el("banner").innerHTML =
      `<div class="banner">Дашборд не получил данные от onionwatch: ${esc(e.message)}.
       Проверьте, что процесс запущен.</div>`;
  }
}

function schedule() {
  clearInterval(timer);
  if (auto) timer = setInterval(load, REFRESH_MS);
}

el("list").addEventListener("click", async ev => {
  const btn = ev.target.closest(".recheck");
  if (!btn) return;
  btn.disabled = true; btn.textContent = "проверяю…";
  await fetch(`/api/targets/${encodeURIComponent(btn.dataset.name)}/check`, { method: "POST" });
  setTimeout(load, 1500);
});
el("filter").addEventListener("input", render);
el("refresh").addEventListener("click", load);
el("only-bad").addEventListener("click", ev => {
  onlyBad = !onlyBad;
  ev.currentTarget.setAttribute("aria-pressed", String(onlyBad));
  render();
});
el("auto").addEventListener("click", ev => {
  auto = !auto;
  ev.currentTarget.setAttribute("aria-pressed", String(auto));
  ev.currentTarget.textContent = "Автообновление: " + (auto ? "вкл" : "выкл");
  schedule();
});

load(); schedule();
</script>
</body>
</html>
