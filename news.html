<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>onionwatch — новости</title>
<style>
  :root {
    --ink: #0f1220;
    --panel: #161a2c;
    --panel-2: #1c2138;
    --line: #272d4a;
    --text: #e7e9f5;
    --muted: #949bc4;
    --dim: #5d6390;
    --down: #ff5d73;
    --circuit: #8f7bff;
    --mono: ui-monospace, "JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--ink); color: var(--text); font-family: var(--sans);
    font-size: 15px; line-height: 1.5;
    background-image: radial-gradient(circle at 15% -10%, #1d2244 0%, transparent 55%);
    background-attachment: fixed;
  }
  /* Та же ширина, что у дашборда: страницы одного сайта не должны разъезжаться. */
  .wrap { max-width: 1320px; margin: 0 auto; padding: 28px 20px 64px; }

  .eyebrow { font-family: var(--mono); font-size: 11px; letter-spacing: .18em;
    text-transform: uppercase; color: var(--dim); }
  h1 { font-size: 26px; margin: 4px 0 0; font-weight: 620; letter-spacing: -.01em; }
  h1 span { color: var(--circuit); }
  header.top { display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-end;
    justify-content: space-between; border-bottom: 1px solid var(--line); padding-bottom: 18px; }
  .top-right { display: flex; flex-direction: column; align-items: flex-end; gap: 10px; }

  /* Верхнее меню: одинаковое на всех страницах. */
  nav.nav { display: flex; gap: 6px; flex-wrap: wrap; }
  nav.nav a { font-family: var(--mono); font-size: 12px; letter-spacing: .04em;
    text-decoration: none; color: var(--muted); background: var(--panel);
    border: 1px solid var(--line); border-radius: 8px; padding: 7px 12px; }
  nav.nav a:hover { background: var(--panel-2); border-color: #3a4270; color: var(--text); }
  nav.nav a[aria-current="page"] { color: #fff; border-color: var(--circuit);
    background: linear-gradient(var(--panel-2), var(--panel)); }
  nav.nav a[hidden] { display: none; }
  :focus-visible { outline: 2px solid var(--circuit); outline-offset: 2px; }

  .feed { display: flex; flex-direction: column; gap: 16px; margin-top: 22px; }
  .post { background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    padding: 16px 18px 18px; }
  .when { font-family: var(--mono); font-size: 11px; letter-spacing: .06em;
    text-transform: uppercase; color: var(--dim); }
  /* Картинку новости не режем: она часть сообщения, а не аватар. Ширину берёт
     по колонке, высоту ограничиваем, чтобы вертикальный кадр не занимал экран. */
  .shot { display: block; width: 100%; height: auto; max-height: 460px;
    object-fit: contain; border-radius: 10px; border: 1px solid var(--line);
    background: var(--panel-2); margin: 12px 0 0; }
  .text { margin-top: 12px; }
  /* Строка длиной во весь дашборд не читается — ширину берёт на себя вёрстка
     новости, а не сам абзац. */
  .body { font-size: 15.5px; max-width: 74ch; }
  .body p { margin: 12px 0 0; overflow-wrap: anywhere; }
  .body p:first-child { margin-top: 0; }

  /* На широком экране картинка встаёт слева, текст справа: страница занимает
     ту же ширину, что и дашборд, и не оставляет полполосы пустой. Ниже 900
     пикселей они снова идут друг под другом. */
  @media (min-width: 900px) {
    .post.with-shot { display: grid; align-items: start; column-gap: 22px;
      grid-template-columns: minmax(0, 420px) minmax(0, 1fr);
      grid-template-areas: "when when" "shot text"; }
    .post.with-shot .when { grid-area: when; }
    .post.with-shot .shot { grid-area: shot; }
    .post.with-shot .text { grid-area: text; }
  }
  /* Источник — отдельная строка под текстом, а не слово внутри него. */
  .source { margin: 14px 0 0; }
  .source a { font-family: var(--mono); font-size: 12px; letter-spacing: .04em;
    text-decoration: none; color: var(--muted); background: var(--panel-2);
    border: 1px solid var(--line); border-radius: 8px; padding: 6px 11px;
    display: inline-block; }
  .source a:hover { color: var(--text); border-color: #3a4270; }

  /* Пейджер: стрелки по краям, номера между ними. Выглядит как верхнее меню —
     это те же ссылки, только внутри ленты. */
  .pager { display: flex; gap: 6px; flex-wrap: wrap; align-items: center;
    justify-content: center; margin-top: 22px; }
  .pager a, .pager span { font-family: var(--mono); font-size: 12px;
    letter-spacing: .04em; text-decoration: none; color: var(--muted);
    border: 1px solid var(--line); border-radius: 8px; padding: 7px 12px;
    background: var(--panel); }
  .pager a:hover { background: var(--panel-2); border-color: #3a4270; color: var(--text); }
  .pager .here { color: #fff; border-color: var(--circuit);
    background: linear-gradient(var(--panel-2), var(--panel)); }
  /* Недоступная стрелка и многоточие — не кнопки: ни рамки, ни фона. */
  .pager .off { color: var(--dim); border-color: transparent; background: none; }
  .pager .gap { border-color: transparent; background: none; padding: 7px 2px; }

  .empty-state { border: 1px dashed var(--line); border-radius: 12px; padding: 44px 24px;
    text-align: center; color: var(--muted); }
  .empty-state a { color: var(--circuit); }
  .banner { border: 1px solid var(--down); background: rgba(255,93,115,.08);
    border-radius: 10px; padding: 12px 16px; margin-top: 18px; font-size: 14px; }
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <div>
      <div class="eyebrow">Что нового</div>
      <h1>onion<span>watch</span> — новости</h1>
    </div>
    <div class="top-right">
      <nav class="nav" aria-label="Разделы">
        <a href="/" data-admin hidden>Дашборд</a>
        <a href="/news" aria-current="page">Новости</a>
        <a href="/admin" data-admin hidden>Админка</a>
      </nav>
    </div>
  </header>

  <div id="banner"></div>
  <div class="feed" id="feed"></div>
  <div id="pager"></div>
</div>

<script>
const el = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const when = ts => new Date(ts * 1000).toLocaleString("ru-RU",
  { day: "numeric", month: "long", year: "numeric", hour: "2-digit", minute: "2-digit" });

// Разметки в тексте нет — есть переносы строк, которые автор расставил сам.
// Пустая строка разбивает на абзацы, одиночная остаётся переносом.
const paragraphs = text => esc(text).split(/\n{2,}/)
  .map(p => `<p>${p.replace(/\n/g, "<br>")}</p>`).join("");

function post(n) {
  // Версия в URL — updated_at: без неё после замены картинки браузер показал бы
  // старую из кэша, а кэш здесь нарочно долгий.
  const shot = n.has_image
    ? `<img class="shot" src="/api/news/${n.id}/image?v=${n.image_v}" alt="Изображение к новости">`
    : "";
  // Первоисточник — отдельной ссылкой в конце новости, а не внутри текста.
  // Открывается в новом окне: no-referrer и noopener, чтобы страница по ту
  // сторону не узнала, откуда пришли, и не дотянулась до ленты.
  const source = n.source
    ? `<p class="source"><a href="${esc(n.source)}" target="_blank"
         rel="noopener noreferrer nofollow" title="${esc(n.source)}"
         aria-label="Источник: ${esc(n.source)}, откроется в новом окне"
         >Источник<span aria-hidden="true"> ↗</span></a></p>`
    : "";
  // Класс with-shot включает двухколоночную раскладку: без картинки колонке
  // слева нечего занимать, и текст идёт как обычно.
  return `<article class="post${n.has_image ? " with-shot" : ""}" id="n${n.id}">
    <div class="when">${esc(when(n.created_at))}</div>
    ${shot}
    <div class="text">
      <div class="body">${paragraphs(n.text)}</div>
      ${source}
    </div>
  </article>`;
}

// -- страницы --------------------------------------------------------------

// Номер страницы живёт в адресе: ссылку на вторую можно дать кому угодно,
// а «назад» в браузере возвращает туда, где были.
const pageFromUrl = () => {
  const n = Number(new URLSearchParams(location.search).get("page"));
  return Number.isInteger(n) && n > 0 ? n : 1;
};

// Номера вокруг текущей страницы: первая, последняя и соседи, между ними —
// многоточие. Иначе на двадцатой странице пейджер занял бы больше места,
// чем сама новость.
function pageNumbers(page, pages) {
  const near = [1, pages, page, page - 1, page + 1]
    .filter(n => n >= 1 && n <= pages)
    .sort((a, b) => a - b);
  const out = [];
  for (const n of near) {
    const last = out[out.length - 1];
    if (last === n) continue;
    if (out.length && n - last > 1) out.push(null);   // разрыв в нумерации
    out.push(n);
  }
  return out;
}

// Первая страница живёт по чистому адресу: ?page=1 — тот же /news.
const pageHref = n => n > 1 ? `?page=${n}` : location.pathname;

function pager(page, pages) {
  if (pages < 2) return "";
  const link = (n, text, extra = "") =>
    `<a href="${pageHref(n)}" data-page="${n}" ${extra}>${esc(String(text))}</a>`;
  const arrow = (n, text, ok) => ok ? link(n, text)
    : `<span class="off" aria-hidden="true">${esc(text)}</span>`;
  const numbers = pageNumbers(page, pages).map(n =>
    n === null ? `<span class="gap" aria-hidden="true">…</span>`
    : n === page ? `<span class="here" aria-current="page"
                      aria-label="Страница ${n} из ${pages}">${n}</span>`
    : link(n, n, `aria-label="Страница ${n}"`));
  return `<nav class="pager" aria-label="Страницы новостей">
    ${arrow(page - 1, "← Новее", page > 1)}
    ${numbers.join("")}
    ${arrow(page + 1, "Старее →", page < pages)}
  </nav>`;
}

async function load(page) {
  try {
    const r = await fetch(`/api/news?page=${page}`, { cache: "no-store" });
    if (r.status === 401) { location.href = "/admin"; return; }
    if (!r.ok) throw new Error("HTTP " + r.status);
    const data = await r.json();
    el("banner").innerHTML = "";
    el("feed").innerHTML = data.news.length ? data.news.map(post).join("")
      : `<div class="empty-state">Новостей пока нет.<br>
         Первую можно опубликовать в <a href="/admin">админке</a>.</div>`;
    el("pager").innerHTML = pager(data.page, data.pages);
    // Сервер мог поправить номер: страницы за краем ленты он сводит
    // к последней. Адрес приводим к тому, что получили на самом деле.
    if (data.page !== page) history.replaceState(null, "", pageHref(data.page));
  } catch (e) {
    el("banner").innerHTML =
      `<div class="banner">Новости не загрузились: ${esc(e.message)}.
       Проверьте, что процесс onionwatch запущен.</div>`;
  }
}

el("pager").addEventListener("click", ev => {
  const link = ev.target.closest("a[data-page]");
  // Ctrl, Shift и средняя кнопка открывают ссылку по-своему — не мешаем.
  if (!link || ev.metaKey || ev.ctrlKey || ev.shiftKey || ev.altKey) return;
  ev.preventDefault();
  const page = Number(link.dataset.page);
  history.pushState(null, "", pageHref(page));
  window.scrollTo(0, 0);
  load(page);
});

window.addEventListener("popstate", () => load(pageFromUrl()));

// Обычный посетитель видит в меню только «Новости»: дашборд и админка
// появляются, когда /api/session подтверждает вход под админом.
async function navForAdmin() {
  try {
    const s = await (await fetch("/api/session", { cache: "no-store" })).json();
    if (!s.authed) return;
    for (const a of document.querySelectorAll("nav.nav a[data-admin]")) a.hidden = false;
  } catch (e) { /* не ответили — меню просто останется без админских ссылок */ }
}

navForAdmin();
load(pageFromUrl());
</script>
</body>
</html>
